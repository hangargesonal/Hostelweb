spring.application.name=hostel-management
server.port=8080

# Database configuration: use environment variables to avoid committing secrets to the repo.
# Example (Docker/Docker Compose): set JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/hostel_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.fail-on-empty-beans=false
